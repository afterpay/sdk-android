name: Validate Maven Central credentials

on:
  push:
    branches: [ nalexander/validate-maven-signing ]

permissions:
  contents: read

jobs:
  validate-central-authentication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate token without publishing
        shell: bash
        run: |
          authorization="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 | tr -d '\n')"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $authorization" \
            https://central.sonatype.com/api/v1/publisher/deployments)"
          echo "Central authentication returned HTTP $status"
          test "$status" = 200
        env:
          CENTRAL_USERNAME: ${{ secrets.SONATYPE_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.SONATYPE_CENTRAL_PASSWORD }}
