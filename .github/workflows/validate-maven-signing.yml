name: Validate Maven signing credentials

on:
  push:
    branches: [ nalexander/validate-maven-signing ]

permissions:
  contents: read

jobs:
  validate-signing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone Repository
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Sign stable artifacts without publishing
        run: ./gradlew afterpay:signMavenPublication -PVERSION_NAME=4.9.0 --no-configuration-cache --no-daemon --no-parallel --stacktrace
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SECRET_PASSPHRASE }}
